<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VidEarn Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><h1>Vid<span>Earn</span> Admin</h1><div id="login" class="card"><input id="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><section id="dash" hidden><div id="stats"></div><h2>Withdrawals</h2><div id="list"></div></section></main><script>
async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});let x=await r.json();if(!r.ok)return alert(x.error);if(x.user.role!=='admin')return alert('Admin only');document.getElementById('login').hidden=true;document.getElementById('dash').hidden=false;load()}
async function load(){let s=await (await fetch('/api/admin/stats')).json();document.getElementById('stats').innerHTML='<div class="card">Users: '+s.users+'<br>Tasks: '+s.tasks+'<br>Pending withdrawals: '+s.pendingWithdrawals+'</div>';let r=await (await fetch('/api/admin/withdrawals')).json();document.getElementById('list').innerHTML=r.map(w=>'<div class="card"><b>#'+w.id+' '+w.name+'</b><br>'+w.email+'<br>$'+w.amount_usd+' · '+w.iban+' · '+w.status+'<br><button onclick="status('+w.id+',\\'approved\\')">Approve</button> <button onclick="status('+w.id+',\\'paid\\')">Paid</button> <button onclick="status('+w.id+',\\'rejected\\')">Reject</button></div>').join('')}
async function status(id,status){await fetch('/api/admin/withdrawals/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
</script></body></html>
